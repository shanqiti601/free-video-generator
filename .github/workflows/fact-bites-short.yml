name: Build Fact Bites Documentary Short

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fact_bites_short.py'
      - 'core/model_team.py'
      - '.github/workflows/fact-bites-short.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Validate AI team and video scripts
        run: python -m py_compile core/model_team.py scripts/fact_bites_short.py
      - name: Generate documentary short
        env:
          FACT_BITES_AI_REVIEW: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_MODEL: ${{ vars.GEMINI_FREE_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODEL: ${{ vars.GROQ_FREE_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL }}
        run: python scripts/fact_bites_short.py
      - name: Save MP4 for download
        uses: actions/upload-artifact@v4
        with:
          name: Fact-Bites-Documentary
          path: output/Fact-Bites-Short.mp4
          if-no-files-found: error
          retention-days: 7
