name: Build Fact Bites Short

on:
  workflow_dispatch:
    inputs:
      hook:
        description: "Opening hook"
        required: false
        default: "This sounds impossible..."
        type: string
      fact:
        description: "The fact to explain"
        required: false
        default: "An octopus has three hearts."
        type: string
      why:
        description: "Short explanation"
        required: false
        default: "Two pump blood to the gills, while one pumps blood to the rest of its body."
        type: string
      cta:
        description: "Closing line"
        required: false
        default: "Follow Fact Bites for more surprising facts."
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts pillow

      - name: Generate narrated vertical video
        env:
          HOOK: ${{ inputs.hook || 'This sounds impossible...' }}
          FACT: ${{ inputs.fact || 'An octopus has three hearts.' }}
          WHY: ${{ inputs.why || 'Two pump blood to the gills, while one pumps blood to the rest of its body.' }}
          CTA: ${{ inputs.cta || 'Follow Fact Bites for more surprising facts.' }}
        run: |
          python scripts/fact_bites_short.py \
            --hook "$HOOK" \
            --fact "$FACT" \
            --why "$WHY" \
            --cta "$CTA"

      - name: Save MP4 for download
        uses: actions/upload-artifact@v4
        with:
          name: Fact-Bites-Short
          path: output/Fact-Bites-Short.mp4
          if-no-files-found: error
          retention-days: 7
