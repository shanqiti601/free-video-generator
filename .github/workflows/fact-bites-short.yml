name: Build Fact Bites Documentary Short

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fact_bites_short.py'
      - 'core/model_team.py'
      - 'FACT_BITES_AGENTS.md'
      - '.agents/skills/**'
      - 'docs/AI_TEAM.md'
      - '.github/workflows/fact-bites-short.yml'

permissions:
  contents: read

concurrency:
  group: fact-bites-short-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Validate AI team and video scripts
        run: python -m py_compile core/model_team.py scripts/fact_bites_short.py
      - name: Validate portable agent skills
        run: |
          python - <<'PY'
          from pathlib import Path
          skills = [
              ".agents/skills/fact-bites-fact-check/SKILL.md",
              ".agents/skills/fact-bites-documentary-script/SKILL.md",
              ".agents/skills/fact-bites-video-qa/SKILL.md",
              ".agents/skills/fact-bites-youtube-publishing/SKILL.md",
          ]
          for name in skills:
              path = Path(name)
              body = path.read_text(encoding="utf-8")
              if not body.startswith("---") or "description:" not in body.split("---", 2)[1]:
                  raise SystemExit(f"Invalid Agent Skill metadata: {name}")
              print(f"SKILL_OK={name}")
          PY
      - name: Generate documentary short
        env:
          FACT_BITES_AI_REVIEW: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL }}
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_FREE_MODEL: ${{ vars.FREELLMAPI_FREE_MODEL }}
        run: python scripts/fact_bites_short.py
      - name: Save MP4 for download
        uses: actions/upload-artifact@v4
        with:
          name: Fact-Bites-Documentary
          path: |
            output/Fact-Bites-Short.mp4
            output/AI-Peer-Review.txt
          if-no-files-found: error
          retention-days: 7
