name: Build Fact Bites Documentary Short

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fact_bites_short.py'
      - 'scripts/qa_fact_bites.py'
      - 'CLAUDE.md'
      - '.claude/skills/**'
      - 'core/model_team.py'
      - 'FACT_BITES_AGENTS.md'
      - '.agents/skills/**'
      - 'docs/AI_TEAM.md'
      - '.github/workflows/fact-bites-short.yml'

permissions:
  contents: read

concurrency:
  group: fact-bites-short-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free video tools when missing
        run: |
          missing=()
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            missing+=(ffmpeg)
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            missing+=(fonts-dejavu-core)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y "${missing[@]}"
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          ffmpeg -version | head -n 1
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Validate AI team and video scripts
        run: python -m py_compile core/model_team.py scripts/fact_bites_short.py scripts/qa_fact_bites.py
      - name: Validate portable and Claude Code skills
        run: |
          python - <<'PY'
          from pathlib import Path
          names = ["fact-bites-fact-check", "fact-bites-documentary-script", "fact-bites-video-qa", "fact-bites-youtube-publishing"]
          for root in (".agents/skills", ".claude/skills"):
              for name in names:
                  path = Path(root) / name / "SKILL.md"
                  body = path.read_text(encoding="utf-8")
                  if not body.startswith("---") or "description:" not in body.split("---", 2)[1]:
                      raise SystemExit(f"Invalid Agent Skill metadata: {path}")
                  print(f"SKILL_OK={path}")
          PY
      - name: Generate documentary short
        env:
          FACT_BITES_AI_REVIEW: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL }}
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_FREE_MODEL: ${{ vars.FREELLMAPI_FREE_MODEL }}
        run: python scripts/fact_bites_short.py
      - name: Run final technical video QA
        run: python scripts/qa_fact_bites.py
      - name: Save MP4 for download
        uses: actions/upload-artifact@v4
        with:
          name: Fact-Bites-Documentary
          path: |
            output/Fact-Bites-Short.mp4
            output/AI-Peer-Review.txt
            output/Video-QA.txt\n            output/Research-Sources.txt
          if-no-files-found: error
          retention-days: 7
