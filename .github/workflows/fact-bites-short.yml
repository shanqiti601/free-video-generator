name: Build Fact Bites Documentary Short

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fact_bites_short.py'
      - '.github/workflows/fact-bites-short.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Generate documentary short
        run: python scripts/fact_bites_short.py
      - name: Save MP4 for download
        uses: actions/upload-artifact@v4
        with:
          name: Fact-Bites-Documentary
          path: output/Fact-Bites-Short.mp4
          if-no-files-found: error
          retention-days: 7
