name: FACT BITES — Ant Life Cycle Animation

on:
  push:
    paths:
      - 'scripts/fact_bites_ant_lifecycle.py'
      - '.github/workflows/fact-bites-ant-life.yml'

permissions:
  contents: write

concurrency:
  group: fact-bites-ant-life
  cancel-in-progress: false

jobs:
  render-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free animation and narration tools
        run: python -m pip install --upgrade pip pillow edge-tts
      - name: Render ant life cycle episode
        run: python scripts/fact_bites_ant_lifecycle.py
      - name: Verify final video and captions
        run: |
          set -euo pipefail
          ffmpeg -v error -i output/FACT-BITES-ANT-LIFE-CYCLE.mp4 -f null -
          test -s output/ant/captions.srt
          test -s output/ant/narration.mp3
          python - <<'PY'
          import json, pathlib, subprocess
          p='output/FACT-BITES-ANT-LIFE-CYCLE.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height']) == (720,1280)
          assert any(s['codec_type']=='audio' for s in d['streams'])
          assert float(d['format']['duration']) >= 35
          assert pathlib.Path('output/ant/captions.srt').stat().st_size > 100
          print('ANT_EPISODE_QA=PASS')
          PY
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fact-bites-ant-life-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" output/FACT-BITES-ANT-LIFE-CYCLE.mp4 output/ant/captions.srt output/ant/narration.mp3 --repo "$GITHUB_REPOSITORY" --title "FACT BITES — The Secret Life of an Ant" --notes "Original illustrated educational animation. Voiceover generated with edge-tts. Captions included."
      - uses: actions/upload-artifact@v4
        with:
          name: FACT-BITES-ANT-LIFE-CYCLE
          path: |
            output/FACT-BITES-ANT-LIFE-CYCLE.mp4
            output/ant/captions.srt
            output/ant/narration.mp3
          if-no-files-found: error
          retention-days: 7
