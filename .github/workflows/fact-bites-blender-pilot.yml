name: FACT BITES UNBOXED — Full 3D Episode
on:
  workflow_dispatch:
  push:
    branches: [experiment/blender-3d-pilot]
    paths:
      - 'scripts/blender_3d_pilot.py'
      - 'scripts/qwen_review.py'
      - '.github/workflows/fact-bites-blender-pilot.yml'
permissions:
  contents: read
concurrency:
  group: fact-bites-blender-pilot
  cancel-in-progress: true
jobs:
  full-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install free 3D, audio and subtitle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install edge-tts
      - name: Verify render and narration tools
        run: |
          blender --version
          ffmpeg -version
          python -m edge_tts --help >/dev/null
      - name: Render genuine procedural 3D animation
        run: |
          mkdir -p output/unboxed
          blender -b -t 2 --python scripts/blender_3d_pilot.py
          test -s output/unboxed/BLENDER-3D-BASE.mp4
      - name: Generate deep English narration and timed subtitles
        run: |
          cat > output/unboxed/narration.txt <<'EOF'
          That tiny metal ball is why a pen can write. As the pen moves, the ball rolls across the paper, picking up ink from the reservoir inside. A narrow metal socket holds the ball in place while still letting it spin freely. The spring returns the click mechanism after each press. A tiny rolling machine turns motion into writing.
          EOF
          python -m edge_tts --voice en-US-GuyNeural --rate=-8% --text "$(cat output/unboxed/narration.txt)" --write-media output/unboxed/narration.mp3
          cat > output/unboxed/subtitles.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:03,600
          That tiny metal ball is why a pen can write.
          
          2
          00:00:03,600 --> 00:00:07,200
          As the pen moves, the ball rolls across the paper.
          
          3
          00:00:07,200 --> 00:00:10,800
          Its surface picks up ink from the reservoir inside.
          
          4
          00:00:10,800 --> 00:00:14,400
          A narrow metal socket holds the ball in place,
          
          5
          00:00:14,400 --> 00:00:17,700
          while still letting it spin freely.
          
          6
          00:00:17,700 --> 00:00:21,500
          The spring returns the click mechanism after each press.
          
          7
          00:00:21,500 --> 00:00:25,200
          A tiny rolling machine turns motion into writing.
          
          8
          00:00:25,200 --> 00:00:27,000
          FACT BITES UNBOXED
          EOF
      - name: Add safe-area brand, burned-in subtitles and narration
        run: |
          ffmpeg -y -i output/unboxed/BLENDER-3D-BASE.mp4 -i output/unboxed/narration.mp3 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='FACT BITES UNBOXED':fontcolor=white:fontsize=21:borderw=1:bordercolor=black@0.55:x=(w-text_w)/2:y=54,subtitles=output/unboxed/subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H80000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=118,MarginL=42,MarginR=42'" \
            -af "apad=pad_dur=27" -t 27 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 160k -shortest output/unboxed/FACT-BITES-UNBOXED-EP01.mp4
          test -s output/unboxed/FACT-BITES-UNBOXED-EP01.mp4
      - name: Verify complete episode and extract visual QA frames
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json output/unboxed/FACT-BITES-UNBOXED-EP01.mp4 | tee output/unboxed/QA-METADATA.json
          python - <<'PY'
          import json, subprocess
          p='output/unboxed/FACT-BITES-UNBOXED-EP01.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          v=next(x for x in d['streams'] if x['codec_type']=='video')
          a=next(x for x in d['streams'] if x['codec_type']=='audio')
          duration=float(d['format']['duration'])
          assert (v['width'],v['height'])==(540,960), (v['width'],v['height'])
          assert duration >= 26.5, duration
          assert a['codec_name'] in ('aac','mp3'), a
          for i,t in enumerate([2.0,9.0,18.0,25.5],1):
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(t),'-i',p,'-frames:v','1','-q:v','3',f'output/unboxed/final_{i}.jpg'],check=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-i','output/unboxed/final_1.jpg','-i','output/unboxed/final_2.jpg','-i','output/unboxed/final_3.jpg','-i','output/unboxed/final_4.jpg','-filter_complex','hstack=inputs=4,scale=1080:-1','-frames:v','1','output/unboxed/QA-CONTACT-SHEET.jpg'],check=True)
          print('FULL_EPISODE_QA_PASSED', duration, v['width'], v['height'], a['codec_name'])
          PY
      - name: Independent Qwen visual and script review
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: qwen3.8-max
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ] || [ -z "$QWEN_BASE_URL" ]; then
            echo "QWEN_REVIEW_SKIPPED: configure DASHSCOPE_API_KEY and QWEN_BASE_URL secrets."
            exit 0
          fi
          python scripts/qwen_review.py \
            --script output/unboxed/narration.txt \
            --frames output/unboxed/final_1.jpg output/unboxed/final_2.jpg output/unboxed/final_3.jpg output/unboxed/final_4.jpg \
            --output output/unboxed/QWEN-REVIEW.json
      - name: Upload full episode and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FACT-BITES-UNBOXED-EPISODE-01
          path: |
            output/unboxed/FACT-BITES-UNBOXED-EP01.mp4
            output/unboxed/QA-METADATA.json
            output/unboxed/QA-CONTACT-SHEET.jpg
            output/unboxed/QWEN-REVIEW.json
            output/unboxed/narration.txt
            output/unboxed/subtitles.srt
          if-no-files-found: ignore
          retention-days: 14
