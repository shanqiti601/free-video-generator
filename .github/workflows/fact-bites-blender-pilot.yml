name: FACT BITES UNBOXED — Blender 3D Experimental Pilot

on:
  workflow_dispatch:
  push:
    branches: [experiment/blender-3d-pilot]
    paths:
      - 'scripts/blender_3d_pilot.py'
      - '.github/workflows/fact-bites-blender-pilot.yml'

permissions:
  contents: read

concurrency:
  group: fact-bites-blender-pilot
  cancel-in-progress: true

jobs:
  blender-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install free 3D renderer and media QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Verify Blender and FFmpeg
        run: |
          blender --version
          ffmpeg -version
          ffprobe -version
      - name: Render genuine procedural 3D pen mechanism
        run: |
          mkdir -p output/unboxed
          blender -b -t 2 --python scripts/blender_3d_pilot.py
      - name: Verify MP4 structure and extract QA frames
        run: |
          test -s output/unboxed/BLENDER-3D-PILOT.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json output/unboxed/BLENDER-3D-PILOT.mp4 | tee output/unboxed/QA-METADATA.json
          python - <<'PY'
          import json, subprocess
          p='output/unboxed/BLENDER-3D-PILOT.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          v=next(x for x in d['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'])==(540,960), (v['width'],v['height'])
          assert float(d['format']['duration']) >= 7.5
          assert any(x['codec_type']=='video' for x in d['streams'])
          for i,t in enumerate([1.0,4.0,7.0],1):
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(t),'-i',p,'-frames:v','1','-q:v','3',f'output/unboxed/qa_{i}.jpg'],check=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-i','output/unboxed/qa_1.jpg','-i','output/unboxed/qa_2.jpg','-i','output/unboxed/qa_3.jpg','-filter_complex','hstack=inputs=3,scale=810:-1','-frames:v','1','output/unboxed/QA-CONTACT-SHEET.jpg'],check=True)
          print('TECHNICAL_QA_PASSED')
          PY
      - name: Upload experimental 3D render and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FACT-BITES-BLENDER-3D-PILOT
          path: |
            output/unboxed/BLENDER-3D-PILOT.mp4
            output/unboxed/QA-METADATA.json
            output/unboxed/QA-CONTACT-SHEET.jpg
          if-no-files-found: ignore
          retention-days: 14
