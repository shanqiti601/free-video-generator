name: FACT BITES UNBOXED — Free Video Production

on:
  workflow_dispatch:
  schedule:
    - cron: '10 14 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/fact_bites_unboxed.py'
      - '.github/workflows/fact-bites-unboxed.yml'

permissions:
  contents: write

concurrency:
  group: fact-bites-unboxed-production-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
          fc-match 'DejaVu Sans'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free narration dependency
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Build one original short
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/fact_bites_unboxed.py
      - name: Persist recent topic history
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fact_bites_topic_history.json
          if git diff --cached --quiet; then
            echo 'Topic history unchanged'
          else
            git commit -m 'Update Fact Bites topic history'
            git push
          fi
      - name: Upload render and QA material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FACT-BITES-UNBOXED-${{ github.run_number }}
          path: |
            output/unboxed/FACT-BITES-UNBOXED.mp4
            output/unboxed/ASSET-CREDITS.txt
            output/unboxed/captions.ass
            output/unboxed/QA-CONTACT-SHEET.jpg
          if-no-files-found: ignore
          retention-days: 14
