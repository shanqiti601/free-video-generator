name: FACT BITES UNBOXED — Free Video Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fact_bites_unboxed.py'
      - '.github/workflows/fact-bites-unboxed.yml'

permissions:
  contents: read

concurrency:
  group: fact-bites-unboxed-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free narration dependency
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Build one original short
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/fact_bites_unboxed.py
      - name: Upload render and credits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FACT-BITES-UNBOXED-${{ github.run_number }}
          path: |
            output/unboxed/FACT-BITES-UNBOXED.mp4
            output/unboxed/ASSET-CREDITS.txt
            output/unboxed/captions.ass
          if-no-files-found: error
          retention-days: 14
